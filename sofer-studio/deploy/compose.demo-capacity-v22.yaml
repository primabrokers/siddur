services:
  demo-v22:
    image: prima-sofer-studio:demo-capacity-v22
    container_name: prima-sofer-demo-v22
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Twelve isolated processes retain the original 768 MiB JS and 256 MiB
    # SQLite ceilings. The aggregate bound includes native memory headroom.
    pids_limit: 256
    mem_limit: 16384m
    cpus: 2
    command: [node, /app/demo/gateway.mjs]
    environment:
      SOFER_DEMO_COOKIE: __Host-sofer_demo_v22
      SOFER_DEMO_MAX_SESSIONS: "12"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16777216,uid=1000,gid=1000,mode=1777
    networks:
      gateway:
        aliases: [sofer-studio-demo-v22]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
networks:
  gateway:
    external: true
    name: agent-stack_default
