name: Deploy to GitHub Pages

# Publishes the PWA on every push to main.
#
# Pages here serves the gh-pages branch, so this builds the site and force-pushes
# it there. The alternative — Pages' own Actions deployment — needs Source set to
# "GitHub Actions" in the repository settings, and switching that on a site
# already serving happily from a branch would take it down for no gain.
#
# gh-pages is generated, never edited by hand, which is why the push is a force:
# its history is disposable and always exactly what main produced.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # to push the built site to gh-pages

# Let a running deploy finish rather than cancelling it — a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        # Only what the app serves. The tests, browser fixtures, sync script and
        # SQL migration stay out — the fixtures especially, since they stub fetch
        # and write to storage, and publishing them would make them live pages.
        run: |
          mkdir -p _site
          cp index.html siddur.html chumash.html tehillim.html mishnayos.html offline.html manifest.webmanifest sw.js _site/
          cp -r icons js _site/
          # Jekyll would otherwise process this hand-written site and skip files
          # it does not recognise.
          touch _site/.nojekyll
          echo "Staging:"; find _site -type f | sort

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q
          git checkout -qb gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish ${GITHUB_SHA::7}

          Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}."
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
          echo "Published to gh-pages. Live at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
