name: Deploy to GitHub Pages

# Publishes the PWA to GitHub Pages on every push to main.
#
# configure-pages runs with enablement:true, so the first run turns Pages on
# by itself rather than needing someone in the repository settings.
#
# HTTPS matters here beyond good practice: service workers refuse to register
# over plain HTTP, so the offline cache and the install prompt only work once
# the app is served from a real origin. Pages provides that.

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages needs pages:write to publish and id-token:write to prove the
# artifact came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        # Copy only what the app serves. Tests, fixtures, the sync script and
        # the migration have no business on a public site, and the fixtures in
        # particular would be live pages if published.
        run: |
          mkdir -p _site
          cp index.html siddur.html offline.html manifest.webmanifest sw.js _site/
          cp -r icons js _site/
          echo "Staged:"; find _site -type f | sort

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it is not already. Needs pages:write, granted above.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
